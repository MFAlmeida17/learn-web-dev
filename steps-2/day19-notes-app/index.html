<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App + Dark Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Notes App</h1>
            <button id="toggleTheme">🌙</button>
        </div>

        <textarea id="noteInput" placeholder="Tulis catatanmu di sini..."></textarea>
        <button id="saveBtn">Simpan Catatanmu</button>

        <h2>Catatan Tersimpan</h2>
        <div id="notesContainer"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
